name: Publish to NPM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint --if-present

      - name: Run typecheck
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build package
        run: npm run build --if-present

  publish:
    name: Publish to NPM Registry
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build package
        run: npm run build --if-present

      - name: Check version and publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ Error: NPM_TOKEN secret is not set or empty in GitHub repository secrets."
            echo "Please go to Repository Settings > Secrets and variables > Actions > Repository secrets and add NPM_TOKEN."
            exit 1
          fi

          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")

          echo "Checking NPM registry for ${PKG_NAME}@${PKG_VER}..."
          EXISTING_VER=$(npm view "${PKG_NAME}@${PKG_VER}" version 2>/dev/null || true)

          if [ "$EXISTING_VER" = "$PKG_VER" ]; then
            echo "⚠️ Version ${PKG_VER} of ${PKG_NAME} is already published on npm. Skipping publication."
          else
            echo "🚀 Publishing ${PKG_NAME}@${PKG_VER} to npmjs.org..."
            npm publish --access public
            echo "✅ Successfully published ${PKG_NAME}@${PKG_VER} to npmjs.org!"
          fi
